  <style>
    .lost { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 120px var(--gutter) 64px; text-align: center; }
    .lost-mark { position: relative; width: 168px; aspect-ratio: 1; margin: 0 auto 28px; }
    .lost-mark .ring { animation-duration: 90s; }
    .lost-mark span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-jp); font-weight: 600; font-size: 64px; color: transparent; -webkit-text-stroke: 1px rgba(245, 163, 192, 0.7); }
    .lost h1 { margin: 0 0 14px; font-family: var(--font-serif); font-weight: 700; font-size: clamp(32px, 3vw + 18px, 52px); line-height: 1.1; }
    .lost p { max-width: 34em; margin: 0 auto 28px; color: var(--text-2); font-size: 17px; }
    .lost .eyebrow { justify-content: center; }
  </style>
</head>
<body>
  <canvas id="petals" aria-hidden="true"></canvas>

  <header class="site-header">
    <nav class="nav" aria-label="Main">
      <a class="brand" href="/">
        <svg class="emblem" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 5.5 27.5 26h-23Z" fill="#f6eff8" stroke="#f6eff8" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M16 19.5a1.2 1.2 0 0 1 2.4 0 2.4 2.4 0 0 1-4.8 0 3.6 3.6 0 0 1 7.2 0" fill="none" stroke="#e5484d" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Lecer</span>
      </a>
    </nav>
  </header>

  <main class="lost">
    <div>
      <div class="lost-mark" aria-hidden="true">
        <svg class="ring" viewBox="0 0 400 400" focusable="false">
          <defs><path id="lost-ring" d="M40 200a160 160 0 1 1 320 0a160 160 0 1 1-320 0"/></defs>
          <circle class="ring-line" cx="200" cy="200" r="194"/>
          <circle class="ring-line ring-line--dash" cx="200" cy="200" r="132"/>
          <text class="ring-text" style="font-size: 24px; letter-spacing: 2px"><textPath href="#lost-ring">白玉楼 · Border of Life · 白玉楼 · Border of Life · 白玉楼 · Border of Life ·</textPath></text>
        </svg>
        <span>迷</span>
      </div>
      <p class="eyebrow">404</p>
      <h1>Lost in the Netherworld</h1>
      <p>This page has drifted off to Hakugyokurou. Even Yuyuko couldn't find it, and she can find any snack.</p>
      <a class="btn btn-primary" href="/">Back to the living world</a>
    </div>
  </main>

</html>
