# Builds data/site.json from live sources and publishes the site to GitHub Pages.
# Runs on every push, every two hours, and by hand from the Actions tab.
# Needs Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # only for the keep-alive step

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch live data
        run: node scripts/update-data.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          DUMBLE_TOKEN: ${{ secrets.DUMBLE_TOKEN }}

      - name: Collect the site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir _site
          cp -r index.html 404.html assets data _site/
          # the pages hard-code the user-site address; point them at wherever this repo is served
          sed -i "s#https://lecer69.github.io/#${BASE_URL}/#g" _site/index.html _site/404.html
          sed -i "s#<base href=\"/\">#<base href=\"${BASE_PATH}/\">#" _site/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # GitHub pauses scheduled workflows after 60 days without repo activity; this keeps it running
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
